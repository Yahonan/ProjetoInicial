name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Checar sintaxe do Js
        run: node --check script.js

      - name: Validar o HTML
        run: npx --yes htmlhint index.html

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: validar
    container:
      image: semgrep/semgrep
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Rodar o Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/owasp-top-ten \
            --sarif-output=semgrep.sarif \
            --error

      - name: Salvar o relatório SAST
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa0# v4.6.2
        with:
          name: relatorio-sast-semgrep
          path: semgrep.sarif

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Subir o site localmente
        run: |
          python3 -m http.server 8080 &
          sleep 3
          curl -sSf http://localhost:8080/ > /dev/null

      - name: Rodar o ZAP baseline scan
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host \
            -v "$(pwd)/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 \
            -r relatorio-zap.html -J relatorio-zap.json -I

      - name: Salvar o relatório DAST
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relatorio-dast-zap
          path: zap-out/

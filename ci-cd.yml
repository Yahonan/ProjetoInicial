name: Ping Google
 
on:
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  schedule:
    - cron: "*/30 * * * *"  # roda a cada 30 minutos
  push:
    branches: [main]
 
jobs:
  ping:
    runs-on: ubuntu-latest
 
    steps:
      - name: Ping em google.com
        run: ping -c 4 google.com
 
      - name: Testar acesso HTTP
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://www.google.com)
          echo "Status HTTP: $status"
          if [ "$status" -ne 200 ]; then
            echo "Falha: o Google não respondeu com 200"
            exit 1
          fi
 
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Meu Kanban</h1>
    <form id="form-tarefa">
      <input type="text" id="campo-tarefa" placeholder="O que você precisa fazer?" aria-label="Nova tarefa" required>
      <select id="campo-prioridade" aria-label="Prioridade">
        <option value="baixa">Baixa</option>
        <option value="media" selected>Média</option>
        <option value="alta">Alta</option>
      </select>
      <button type="submit">Adicionar</button>
    </form>
  </header>

  <div class="barra">
    <input type="search" id="campo-filtro" placeholder="Filtrar tarefas" aria-label="Filtrar tarefas">
    <button type="button" id="limpar-concluidos">Limpar concluídos</button>
  </div>

  <main class="quadro">
    <section class="coluna" data-coluna="fazer">
      <div class="coluna-topo">
        <h2>A fazer</h2>
        <span class="contador">0</span>
      </div>
      <div class="cards"></div>
    </section>

    <section class="coluna" data-coluna="andamento">
      <div class="coluna-topo">
        <h2>Em andamento</h2>
        <span class="contador">0</span>
      </div>
      <div class="cards"></div>
    </section>

    <section class="coluna" data-coluna="concluido">
      <div class="coluna-topo">
        <h2>Concluído</h2>
        <span class="contador">0</span>
      </div>
      <div class="cards"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
